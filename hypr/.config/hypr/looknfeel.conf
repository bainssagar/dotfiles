general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgb(143,188,187)
    col.inactive_border = rgba(595959aa)

    resize_on_border = false

    allow_tearing = false

    layout = scrolling
}

decoration {
    rounding = 15
    rounding_power = 5

    # Change transparency of focused and unfocused windows
    active_opacity = 0.95
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.15
    }
}
