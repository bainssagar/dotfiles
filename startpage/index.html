<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>~ / startpage</title>
    <style>
      /* Kanso-zen inspired color palette */
      :root {
        --bg-color: #090e13; /* Deep dark terminal background */
        --card-bg: #1c1e25; /* Slightly lighter container color */
        --fg-color: #c5c9c7; /* Main text color (soft white/blue) */
        --muted: #a292a3; /* Dimmed comments/subtexts */
        --orange: #b6927b; /* Orange accent */
        --aqua-accent: #8ea4a2; /* Aqua for secondary items */
        --green-accent: #98bb6c; /* Prompt success color */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Google Sans Code NF;
        background-color: var(--bg-color);
        color: var(--fg-color);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 850px;
        width: 100%;
      }

      /* Top Bar Info Dashboard */
      header {
        margin-bottom: 35px;
        border-bottom: 1px dashed var(--muted);
        padding-bottom: 20px;
      }

      .sys-info {
        display: flex;
        justify-content: space-between;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 15px;
      }

      .sys-info span strong {
        color: var(--aqua-accent);
      }

      header h1 {
        font-size: 2.2rem;
        color: var(--fg-color);
        font-weight: normal;
      }

      header h1 span {
        color: var(--aqua-accent);
      }

      /* Terminal Search Box */
      .search-area {
        margin-bottom: 45px;
      }

      .prompt {
        color: var(--green-accent);
        margin-bottom: 10px;
        font-size: 1rem;
      }

      .prompt span {
        color: var(--aqua-accent);
      }

      .search-box form {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-box form::before {
        content: ">";
        position: absolute;
        left: 15px;
        color: var(--aqua-accent);
        font-weight: bold;
        font-size: 1.1rem;
      }

      .search-box input {
        width: 100%;
        padding: 14px 14px 14px 40px;
        background-color: var(--card-bg);
        border: 1px solid #1f2335;
        border-radius: 6px;
        color: var(--fg-color);
        font-family: inherit;
        font-size: 1.05rem;
        outline: none;
        transition: all 0.25s ease-in-out;
      }

      .search-box input:focus {
        border-color: var(--aqua-accent);
        box-shadow: 0 0 10px rgba(157, 124, 216, 0.15);
      }

      /* Category Grid */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
      }

      .category-box {
        background-color: var(--card-bg);
        padding: 22px;
        border-radius: 6px;
        border: 1px solid #1f2335;
      }

      .category-box h2 {
        font-size: 1.05rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        color: var(--aqua-accent);
        border-bottom: 1px solid #1f2335;
        padding-bottom: 5px;
      }

      .category-box ul {
        list-style: none;
      }

      .category-box ul li {
        margin-bottom: 10px;
      }

      .category-box ul li a {
        color: var(--fg-color);
        text-decoration: none;
        font-size: 0.95rem;
        display: inline-block;
        transition:
          transform 0.15s ease,
          color 0.15s ease;
      }

      .category-box ul li a::before {
        content: "├─ ";
        color: var(--muted);
      }

      .category-box ul li:last-child a::before {
        content: "└─ ";
      }

      .category-box ul li a:hover {
        color: var(--aqua-accent);
        transform: translateX(4px);
      }

      /* Footer Status Line */
      footer {
        margin-top: 50px;
        border-top: 1px dashed var(--muted);
        padding-top: 20px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
      }

      footer span {
        color: var(--aqua-accent);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="sys-info">
          <span>host: <strong>cachyos</strong></span>
          <span id="live-date">FETCHING DATE...</span>
        </div>
        <h1 id="greeting">localhost:~# <span>init 0</span></h1>
      </header>

      <div class="search-area">
        <div class="prompt">sbains@cachyos<span>~ $</span> query --search</div>
        <div class="search-box">
          <form action="https://search.brave.com/search" method="get">
            <input
              type="text"
              name="q"
              placeholder="Type here to search the web..."
              autofocus
              autocomplete="off"
            />
          </form>
        </div>
      </div>

      <div class="grid">
        <div class="category-box">
          <h2>01 // Miscellaneous</h2>
          <ul>
            <li>
              <a href="https://github.com/bainssagar/dotfiles" target="_blank"
                >GitHub</a
              >
            </li>
            <li>
              <a href="https://www.reddit.com/" target="_blank">Reddit</a>
            </li>
            <li>
              <a
                href="https://app.notion.com/p/Reading-List-112e1dc6c3d680a8b6cfc68504897bec"
                target="_blank"
                >Notion</a
              >
            </li>
          </ul>
        </div>

        <div class="category-box">
          <h2>02 // Reading</h2>
          <ul>
            <li>
              <a href="https://asurascans.com/" target="_blank">Manhwa</a>
            </li>
            <li>
              <a href="https://www.natomanga.com/" target="_blank">Manga</a>
            </li>
            <li>
              <a href="https://play.google.com/books" target="_blank">Books</a>
            </li>
          </ul>
        </div>

        <div class="category-box">
          <h2>03 // Media</h2>
          <ul>
            <li><a href="https://youtube.com" target="_blank">YouTube</a></li>
            <li>
              <a href="https://www.netflix.com/browse" target="_blank"
                >Netflix</a
              >
            </li>
            <li>
              <a href="https://open.spotify.com/" target="_blank">Spotify</a>
            </li>
          </ul>
        </div>
      </div>

      <footer>
        <p>System status: <span>ONLINE</span></p>
      </footer>
    </div>

    <script>
      function updateDashboard() {
        const now = new Date();

        // Dynamic Header Terminal Clock
        const timeStr = now.toLocaleTimeString("en-US", {
          hour12: false,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
        const dateStr = now.toLocaleDateString("en-US", {
          weekday: "short",
          month: "short",
          day: "2-digit",
        });
        document.getElementById("live-date").innerText =
          `${dateStr.toUpperCase()} // ${timeStr}`;

        // Smart Greeting based on Time of Day
        const hours = now.getHours();
        let textGreeting = "localhost:~# ";
        if (hours < 12) textGreeting += "good_morning.sh";
        else if (hours < 18) textGreeting += "good_afternoon.sh";
        else textGreeting += "good_evening.sh";

        document.getElementById("greeting").innerHTML =
          `localhost:~# <span>${textGreeting.toLowerCase()}</span>`;
      }

      setInterval(updateDashboard, 1000);
      updateDashboard();
    </script>
  </body>
</html>
